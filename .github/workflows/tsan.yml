name: TSan (ThreadSanitizer)

# ThreadSanitizer build of the daemon, run against tests that exercise
# the per-shard rwlock and parallel-for worker pool. Catches data races
# (one thread reading, another writing, no synchronization) and lock-
# ordering deadlocks.
#
# We run only a curated subset of cases here (--filter): TSan's
# shadow-memory bookkeeping slows the daemon ~10–15×, so a stress test
# like test-stress-no-hang would saturate watchdogs faster than it can
# probe. Race-detection happens via TSan instrumentation regardless of
# throughput — the parallel-index-integrity case fires concurrent bulk
# inserts that exercise the same lock paths under manageable load.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: TSan (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_MODE: tsan
      TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1:print_stacktrace=1:report_signal_unsafe=0:report_atomic_races=0:suppressions=${{ github.workspace }}/.tsan.supp"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build (BUILD_MODE=tsan)
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      # Subset chosen because these exercise multi-thread paths inside the
      # daemon (parallel-for fan-out, per-shard rwlock acquisition, btree
      # cache concurrency) without saturating the daemon under TSan
      # instrumentation.
      - name: TSan subset (intersect / OR / parallel-index-integrity / cursor)
        run: |
          ./build/bin/shard-db-test run test-and-intersection
          ./build/bin/shard-db-test run test-or-logic
          ./build/bin/shard-db-test run test-parallel-index-integrity
          ./build/bin/shard-db-test run test-find-cursor

      - name: Fail if any TSan findings escaped
        run: |
          if grep -Erq "ThreadSanitizer|WARNING:|data race|deadlock" /tmp/shard-db_*/logs/ 2>/dev/null; then
            echo "::error::TSan findings detected in daemon logs"
            grep -Er "ThreadSanitizer|WARNING:|data race|deadlock" /tmp/shard-db_*/logs/ | head -50
            exit 1
          fi
          echo "No TSan findings."
