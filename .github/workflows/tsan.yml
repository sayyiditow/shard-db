name: TSan (ThreadSanitizer)

# ThreadSanitizer build of the daemon, run against the full C test suite.
# Catches data races (one thread reading, another writing, no
# synchronization) and lock-ordering deadlocks.
#
# Runs at --jobs 2. TSan's shadow-memory bookkeeping is expensive, so
# keep the outer width bounded while still using the runner's available
# CPU. The nested test-runner-parallel case is excluded below because its
# own child runner is a timing-sensitive harness test, not a TSan check.
#
# No suppression file: all previously suppressed findings were fixed or
# restructured (2026-08-30) — see docs/plans/2026-08-28-eliminate-tsan-supp.md
# for the rationale on each. Any new TSan finding fails this job and must be
# root-caused, not suppressed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: TSan (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BUILD_MODE: tsan
      # No halt_on_error=0: reported errors must set the failing exit
      # code (collect-all + fail-at-exit), never print-and-pass.
      TSAN_OPTIONS: "second_deadlock_stack=1:print_stacktrace=1:report_signal_unsafe=0:report_atomic_races=0"
      # test-runner-parallel's own nested run-all spawns a --jobs 4
      # sub-run internally, unrelated to the --jobs 2 outer setting below.
      # This runner is too weak for that nested width; narrow it to 2.
      SHARD_TEST_RUNNER_PARALLEL_JOBS: "2"
      # TSan slows every case several-fold and the shared runner adds
      # contention; the 180s default per-case watchdog false-fires on
      # fsync-heavy cases (rebuild family). The job timeout still bounds
      # genuine hangs.
      SHARD_TEST_WATCHDOG_SEC: "900"
      SHARD_TEST_EXCLUDE: "test-auto-reshard-throttle,test-auto-reshard,test-auto-vacuum,test-startup-refuses-unreadable-kf-maintenance,test-startup-refuses-unreadable-kf-count,test-rebuild-legacy-ambiguous-refuses-start,test-parallel-index-integrity,test-durability-corrupt-marker-policy,test-auto-reshard-shutdown-race,test-runner-parallel,test-warmup-vacuum-norace"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (BUILD_MODE=tsan)
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      - name: Run full C test suite under TSan
        # tee: embedded-harness findings print to the runner log, not the
        # daemon log dir — capture them for the scan step below.
        run: |
          set -eo pipefail
          ./build/bin/shard-db-test run-all --exclude "$SHARD_TEST_EXCLUDE" --jobs 2 2>&1 | tee /tmp/suite-output.log

      - name: Fail if any TSan findings escaped
        # always(): this backstop must run even when the suite step fails.
        # Patterns are report SIGNATURES only — bare words like "deadlock"
        # or "WARNING:" false-positive on legitimate test names and TAP
        # lines in the runner output (e.g. test-ordered-walk-kfcache-
        # deadlock). Every real TSan report carries one of the two
        # ThreadSanitizer report prefixes.
        if: always()
        run: |
          if grep -Erq "WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer" /tmp/shard-db_*/logs/ /tmp/suite-output.log 2>/dev/null; then
            echo "::error::TSan findings detected in daemon logs or runner output"
            grep -Er "WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer" /tmp/shard-db_*/logs/ /tmp/suite-output.log | head -50
            exit 1
          fi
          echo "No TSan findings."
