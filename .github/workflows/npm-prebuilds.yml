name: npm prebuilds

on:
  push:
    tags:
      - 'npm-v*'

permissions: read-all

jobs:
  prebuild:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            node: '22'
          - os: ubuntu-latest
            arch: arm64
            node: '22'
            cross: true
          - os: macos-14
            arch: arm64
            node: '22'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (Linux x64)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3 make g++

      - name: Install cross-compile tools (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: npm install
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: prebuildify (linux-x64)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        working-directory: npm
        run: npm run prebuild

      - name: prebuildify (linux-arm64 cross)
        if: matrix.cross
        working-directory: npm
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          PREBUILD_STRIP_BIN: aarch64-linux-gnu-strip
        run: ./node_modules/.bin/prebuildify --napi --strip --arch arm64

      - name: prebuildify (darwin-arm64)
        if: matrix.os == 'macos-14'
        working-directory: npm
        run: npm run prebuild

      - name: Upload prebuilds artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: npm/prebuilds/**/*.node
          retention-days: 1

  publish:
    needs: prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all prebuilds
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: prebuilds-*
          path: npm/prebuilds
          merge-multiple: true

      - name: npm install (no scripts — prebuilds already built)
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
