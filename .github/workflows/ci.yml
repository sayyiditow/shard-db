name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      # Don't cancel the other arch when one fails — we want full signal.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
          - os: linux
            arch: arm64
            # GitHub-hosted ARM64 runner; free for public repos.
            runs-on: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            # GitHub-hosted macOS runner; Apple silicon on macos-latest.
            runs-on: macos-latest
    steps:
      # Pin actions by full commit SHA (Scorecard "Pinned-Dependencies"):
      # tags are mutable, SHAs are not. # vX.Y.Z comment kept so Dependabot
      # can bump it.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install macOS deps
        if: matrix.os == 'macos'
        run: |
          # Runner image already has Homebrew + openssl@3 + ncurses.
          # Just print versions for the log.
          brew --version | head -1
          brew --prefix openssl@3
          uname -a

      - name: Build
        # build.sh produces shard-db, shard-cli, shard-db-test, and
        # shard-db-bench under build/bin/. Test runner ships as a single
        # binary linking every src/test/cases/test_*.c case via
        # TEST_REGISTER static-init; one invocation runs the whole suite.
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      - name: Run full C test suite
        # 40+ cases / 1000+ assertions. Each case spawns its own daemon on
        # a free port at a unique tmpdir, so cases are CWD-independent and
        # parallel-safe within the runner.
        run: ./build/bin/shard-db-test run-all

      - name: Package binary
        # Tag artifact uploads by os+arch so binaries from different
        # matrix legs (linux-x86_64, linux-arm64, macos-arm64) coexist.
        run: |
          tarball="shard-db-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -C build/bin -czf "$tarball" shard-db shard-cli
          ls -l "$tarball"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-db-${{ matrix.os }}-${{ matrix.arch }}
          path: shard-db-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 14
