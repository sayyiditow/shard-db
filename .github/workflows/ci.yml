name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    env:
      # test-runner-parallel's own nested run-all spawns a --jobs 4
      # sub-run internally, unrelated to the --jobs 2 outer setting below.
      # These runners are too weak for that nested width; narrow it to 2.
      SHARD_TEST_RUNNER_PARALLEL_JOBS: "2"
      # Measured ARM64 cases that alone consume ~9 minutes serially. They
      # remain in the manual/scheduled full gate while their regressions are
      # investigated; the PR gate must finish within five minutes.
      # test-binary-index: pre-existing macOS-arm64-only failure (numeric
      # BETWEEN across zero returns a wrong count; numeric lt/eq pass).
      # Invisible until 2026-08-28 because the macOS leg could not compile
      # at all. Excluded from the PR gate only, pending root-cause:
      # docs/plans/2026-08-28-macos-arm64-numeric-between.md
      SHARD_TEST_EXCLUDE: "test-auto-reshard-throttle,test-auto-reshard,test-auto-vacuum,test-startup-refuses-unreadable-kf-maintenance,test-startup-refuses-unreadable-kf-count,test-rebuild-legacy-ambiguous-refuses-start,test-parallel-index-integrity,test-durability-corrupt-marker-policy,test-auto-reshard-shutdown-race,test-parallel-cross-pool-nesting,test-runner-parallel,test-topn-stream-count-no-criteria,test-varlen-pool-donation-stride,test-binary-index"
      # Shared runners under --jobs 2 contention push timing-sensitive
      # cases (e.g. test-request-timeout's many tiny per-request timeouts)
      # past the 180s default. The 25-minute job timeout still bounds
      # genuine hangs.
      SHARD_TEST_WATCHDOG_SEC: "600"
    strategy:
      # Don't cancel the other arch when one fails — we want full signal.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
          - os: linux
            arch: arm64
            # GitHub-hosted ARM64 runner; free for public repos.
            runs-on: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            # GitHub-hosted macOS runner; Apple silicon on macos-latest.
            runs-on: macos-latest
    steps:
      # Pin actions by full commit SHA (Scorecard "Pinned-Dependencies"):
      # tags are mutable, SHAs are not. # vX.Y.Z comment kept so Dependabot
      # can bump it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install macOS deps
        if: matrix.os == 'macos'
        run: |
          # Runner image already has Homebrew + openssl@3 + ncurses.
          # Just print versions for the log.
          brew --version | head -1
          brew --prefix openssl@3
          uname -a

      - name: Build
        # build.sh produces shard-db, shard-cli, shard-db-test, and
        # shard-db-bench under build/bin/. Test runner ships as a single
        # binary linking every src/test/cases/test_*.c case via
        # TEST_REGISTER static-init; one invocation runs the whole suite.
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      # TEMPORARY (scratch branch only) — round-2 diagnostic probe for
      # docs/plans/2026-08-30-macos-numeric-between-upper-layer.md.
      # Remove with the plan close-out.
      - name: PROBE (scratch) — numeric between round 2
        run: ./build/bin/shard-db-test run test-numeric-between-probe2

      - name: Run full C test suite
        # 40+ cases / 1000+ assertions. Each case spawns its own daemon on
        # a free port at a unique tmpdir, so cases are CWD-independent and
        # parallel-safe within the runner. --jobs pinned explicitly:
        # GitHub-hosted runners are 2-4 vCPU, and leaving --jobs unset
        # defaults to sysconf(_SC_NPROCESSORS_ONLN), which over-subscribes
        # these shared/weak runners and caused real contention-driven
        # request timeouts (see docs/plans/2026-07-15-concurrency-and-leak-fixes.md).
        # Dropped from 4 to 2: --jobs 4 still over-subscribes a 2-4 vCPU
        # runner once each worker's own daemon spins up its nproc-sized
        # thread pools, and produced a contention-driven SIGSEGV in an
        # unrelated pre-existing test (trigram executor) that would not
        # reproduce locally even pinned to 2 vCPUs.
        run: ./build/bin/shard-db-test run-all --exclude "$SHARD_TEST_EXCLUDE" --jobs 2

      - name: Package binary
        # Tag artifact uploads by os+arch so binaries from different
        # matrix legs (linux-x86_64, linux-arm64, macos-arm64) coexist.
        run: |
          tarball="shard-db-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -C build/bin -czf "$tarball" shard-db shard-cli
          ls -l "$tarball"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-db-${{ matrix.os }}-${{ matrix.arch }}
          path: shard-db-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 14
