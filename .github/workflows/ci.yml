name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      # Don't cancel the other arch when one fails — we want full signal.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: arm64
            # GitHub-hosted ARM64 runner; free for public repos.
            runs-on: ubuntu-22.04-arm
    steps:
      # Pin actions by full commit SHA (Scorecard "Pinned-Dependencies"):
      # tags are mutable, SHAs are not. # vX.Y.Z comment kept so Dependabot
      # can bump it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        # build.sh produces shard-db, shard-cli, migrate, shard-db-test, and
        # shard-db-bench under build/bin/. Test runner ships as a single
        # binary linking every src/test/cases/test_*.c case via
        # TEST_REGISTER static-init; one invocation runs the whole suite.
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      - name: Run full C test suite
        # 40+ cases / 1000+ assertions. Each case spawns its own daemon on
        # a free port at a unique tmpdir, so cases are CWD-independent and
        # parallel-safe within the runner.
        run: ./build/bin/shard-db-test run-all

      - name: Package binary
        # Tag artifact uploads by arch so both binaries can coexist.
        run: |
          tarball="shard-db-${{ matrix.arch }}.tar.gz"
          tar -C build/bin -czf "$tarball" shard-db shard-cli migrate
          ls -l "$tarball"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-db-${{ matrix.arch }}
          path: shard-db-${{ matrix.arch }}.tar.gz
          retention-days: 14
