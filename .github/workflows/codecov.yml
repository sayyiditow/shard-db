name: Coverage (Codecov)

# Builds with gcov line+branch coverage, runs the tests, uploads the
# .gcov data to Codecov. Surfaces which code paths the test suite
# never exercises — useful for "we have great test coverage" claims to
# match reality.
#
# Public repos use Codecov's tokenless OIDC upload; no secret required.
# (For private repos, CODECOV_TOKEN must be configured in repo secrets.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_MODE: coverage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build deps + lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libncursesw5-dev lcov

      - name: Build (BUILD_MODE=coverage)
        # Coverage flags add ~3× to compile time but the test suite still
        # finishes well under timeout. -O0 keeps line attribution accurate.
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      - name: Run full C test suite (sequential)
        # gcov counters aren't safe across forked processes when test
        # cases overlap. The test runner already spawns one daemon per
        # case sequentially, so .gcda files stay coherent without extra
        # serialization.
        run: ./build/bin/shard-db-test run-all

      - name: Collect coverage
        run: |
          # lcov reads the .gcno (graph) and .gcda (counters) sibling files
          # next to each .o. Then strip system headers and the test/fuzz
          # source trees so we measure only the daemon code under test.
          #
          # --ignore-errors flags:
          #   negative — racing counter (false positive after our atomic flag)
          #   unused   — lcov 2.x errors on exclude patterns that don't match;
          #              src/test/ files DO have .gcda after the C migration,
          #              but we still pass defensively if a pattern misses.
          #   gcov     — geninfo warns about "unexecuted block on non-branch
          #              line" for some inlined functions; informational only.
          lcov --capture --directory . --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors negative,negative,gcov
          lcov --remove coverage.info \
               '/usr/*' '*/src/test/*' '*/src/bench/*' '*/fuzz/*' \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors negative,negative,unused
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          flags: c-suite
          fail_ci_if_error: false      # don't gate the workflow on Codecov outage
