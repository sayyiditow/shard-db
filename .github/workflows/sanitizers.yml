name: Sanitizers (ASan + UBSan)

# Build the daemon with -fsanitize=address,undefined and run the C test
# suite under it. Catches use-after-free, OOB reads/writes, double-free,
# memory leaks, signed integer overflow, alignment violations, NULL
# deref, etc. — exactly the bug class that crashes a database in
# production.
#
# UBSan caught a real misaligned-uint16 bug on the very first run (fixed
# in btree.c via bt_load_u16/bt_store_u16 helpers). Keep this workflow
# green going forward.
#
# Runs on x86_64 only: ARM64 sanitizer support is solid, but the test
# matrix is already long and these bugs are universal C/UB issues that
# x86_64 will catch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan + UBSan (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_MODE: asan
      # halt_on_error=0 so we collect all findings instead of stopping at
      # the first one; abort_on_error=0 lets the daemon survive (else any
      # finding aborts the process and the test wrapper reports failure
      # for the wrong reason).
      ASAN_OPTIONS: "halt_on_error=0:detect_leaks=1:abort_on_error=0:print_stacktrace=1:log_exe_name=1"
      UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1"
      # test-runner-parallel's own nested run-all spawns a --jobs 4
      # sub-run internally, unrelated to the --jobs 2 outer setting below.
      # This runner is too weak for that nested width; narrow it to 2.
      SHARD_TEST_RUNNER_PARALLEL_JOBS: "2"
      SHARD_TEST_EXCLUDE: "test-auto-reshard-throttle,test-auto-reshard,test-auto-vacuum,test-startup-refuses-unreadable-kf-maintenance,test-startup-refuses-unreadable-kf-count,test-rebuild-legacy-ambiguous-refuses-start,test-parallel-index-integrity,test-durability-corrupt-marker-policy,test-auto-reshard-shutdown-race,test-rebuild-txn-crash-after-walk,test-topn-stream-count-no-criteria,test-runner-parallel"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (BUILD_MODE=asan)
        run: SKIP_TESTS=1 ./build.sh && cp build/bin/shard-db ./shard-db

      - name: Run full C test suite under ASan + UBSan
        # --jobs pinned low: ASan/UBSan instrumentation is CPU/memory
        # heavy per test case, and this runner is shared/weak — full-nproc
        # default parallelism caused contention-driven request timeouts.
        run: ./build/bin/shard-db-test run-all --exclude "$SHARD_TEST_EXCLUDE" --jobs 2

      # If ASan/UBSan finds anything, it prints to stderr; each test case's
      # daemon-startup capture catches it. Grep the daemon logs once
      # everything's done as a defensive backstop — if a sanitizer error
      # fired but the test still passed (e.g. via halt_on_error=0), we
      # still want to fail the workflow. Tests run in /tmp so check there.
      - name: Fail if any sanitizer findings escaped
        run: |
          if grep -Erq "AddressSanitizer|UndefinedBehaviorSanitizer|runtime error|SUMMARY: " /tmp/shard-db_*/logs/ 2>/dev/null; then
            echo "::error::Sanitizer findings detected in daemon logs"
            grep -Er "AddressSanitizer|UndefinedBehaviorSanitizer|runtime error|SUMMARY: " /tmp/shard-db_*/logs/ | head -50
            exit 1
          fi
          echo "No sanitizer findings."
