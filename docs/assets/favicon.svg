<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon — tight-cropped variant of logo.svg.
  The full logo.svg has decorative padding (128x128 viewBox, hex fills ~80x80
  in the centre). Browsers don't auto-scale favicon content, so that padding
  becomes wasted pixels at 16/32px. This version trims the viewBox to the
  glyph bounds so the hex fills the entire favicon slot.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="26 10 76 84"
     shape-rendering="geometricPrecision">
  <polygon
    points="64,12 100,32 100,72 64,92 28,72 28,32"
    fill="#58a6ff"/>
  <g stroke="#1f6feb" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="64"  y1="12" x2="64"  y2="92"/>
    <line x1="28"  y1="32" x2="100" y2="72"/>
    <line x1="100" y1="32" x2="28"  y2="72"/>
  </g>
</svg>
